name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 校验仓库内链接与目录锚点
        run: python3 tools/check_links.py
      - name: 校验估值速查表与正文一致
        run: python3 tools/build_speed_table.py --check
